# Streamlit's standard look, in teal: only the colours are changed.

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#06525c"
backgroundColor = "#f7f9f8"
secondaryBackgroundColor = "#ebf0ee"
textColor = "#06525c"
linkColor = "#06525c"

# Timeline colours: work, study, next step.
chartCategoricalColors = ["#06525c", "#9bbcc0", "#d3e3e5"]
